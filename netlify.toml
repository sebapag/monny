# Netlify — Atrium Agent/Admin SPA (market-test stack: Netlify + Supabase only).
# Site root is the monorepo; build only the web/ package.
#
# Required build env (Netlify UI):
#   VITE_SUPABASE_URL      = https://YOUR_PROJECT.supabase.co
#   VITE_SUPABASE_ANON_KEY = <anon public key>
# Optional LangGraph worker (Cloud Run):
#   VITE_WORKER_URL        = https://atrium-worker-….run.app
#
# Without Supabase vars the SPA uses in-browser fixtures (CI/demo).
# Without VITE_WORKER_URL, runs use Edge stub (or fixtures).

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
