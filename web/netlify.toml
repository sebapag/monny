# Alternate Netlify config when the site root is set to `web/`.
# Prefer the repo-root netlify.toml when connecting the whole monorepo.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
