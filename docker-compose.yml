# Atrium LangGraph worker — same Dockerfile as Cloud Run.
# Local Ubuntu (after clone + .env):
#   docker compose up --build
# Or without Docker:
#   pip install -e ".[dev]" && uvicorn monny.worker.app:app --reload --host 127.0.0.1 --port 8000
#
# SPA (fixtures, no worker): cd web && npm install && npm run dev
# SPA against local worker: VITE_WORKER_URL=http://127.0.0.1:8000 npm run dev

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: atrium-worker:local
    ports:
      - "8000:8000"
    environment:
      MONNY_DRY_RUN: "1"
      MONNY_LIVE: "0"
      MONNY_TENANTS_DIR: /app/tenants
      MONNY_DATA_DIR: /app/data
      MONNY_DEFAULT_TENANT: demo
      MONNY_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173"
      MONNY_AUTH_BACKEND: ${MONNY_AUTH_BACKEND:-fixtures}
      MONNY_AUTH_SECRET: ${MONNY_AUTH_SECRET:-atrium-local-dev-secret-change-me}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MONNY_LLM_ENABLED: ${MONNY_LLM_ENABLED:-1}
    volumes:
      - atrium-worker-data:/app/data
      - ./tenants:/app/tenants:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional Vite against the local worker
  web:
    profiles: ["web"]
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules
    environment:
      VITE_WORKER_URL: ${VITE_WORKER_URL:-http://127.0.0.1:8000}
      VITE_ATRIUM_RUNTIME: ${VITE_ATRIUM_RUNTIME:-fixtures}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      worker:
        condition: service_healthy

volumes:
  atrium-worker-data:
  web-node-modules:
