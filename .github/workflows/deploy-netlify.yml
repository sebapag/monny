name: Deploy web to Netlify

# Optional CI deploy. Prefer Netlify Git integration + root netlify.toml for most teams.
#
# Required secrets:
#   NETLIFY_AUTH_TOKEN
#   NETLIFY_SITE_ID
# Build env:
#   VITE_API_BASE_URL — Cloud Run (or other API) origin, no trailing slash

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "VITE_API_BASE_URL (Cloud Run URL)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID."
            echo "Either add secrets, or connect the repo in the Netlify UI (uses netlify.toml)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url }}

      - name: Publish to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./web/dist"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "monny web ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
